<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mohammad zakrad - blockchain developer, Solidity engineer, EIP author.">
  <title>zakrad.nvim</title>
  <link rel="icon" type="image/svg+xml" href="https://commons.wikimedia.org/wiki/Special:FilePath/Neovim-mark-flat.svg">
  <style>
    @font-face {
      font-family: "JetBrainsMono Nerd Font Local";
      src: local("JetBrainsMono Nerd Font Mono"),
        url("file:///path/to/JetBrainsMonoNerdFontMono-Regular.ttf") format("truetype");
      font-weight: 400;
    }

    @font-face {
      font-family: "JetBrainsMono Nerd Font Local";
      src: local("JetBrainsMono Nerd Font Mono Medium"),
        url("file:///path/to/JetBrainsMonoNerdFontMono-Medium.ttf") format("truetype");
      font-weight: 500;
    }

    :root {
      color-scheme: dark;
      --base: #000000;
      --mantle: #000000;
      --surface0: #1d1e29;
      --cursorline: #13141a;
      --surface1: #2f313d;
      --surface2: #3a3d4a;
      --overlay0: #464957;
      --overlay1: #676b80;
      --overlay2: #7d8296;
      --subtext0: #8e94ab;
      --subtext1: #a3aac2;
      --text: #c1c9e6;
      --rosewater: #f5b8ab;
      --flamingo: #f29d9d;
      --pink: #ad6ff7;
      --mauve: #ff8f40;
      --red: #e66767;
      --maroon: #eb788b;
      --peach: #fab770;
      --yellow: #faca64;
      --green: #70cf67;
      --teal: #4cd4bd;
      --sky: #61bdff;
      --sapphire: #4ba8fa;
      --blue: #00bfff;
      --lavender: #00bbcc;
      --mono: "JetBrainsMono Nerd Font Local", "JetBrainsMono Nerd Font Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      height: 100%;
      background: var(--base);
      overflow: hidden;
    }

    body {
      margin: 0;
      color: var(--text);
      font: 14px/1 var(--mono);
      letter-spacing: 0;
      background: var(--base);
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      color: var(--green);
      outline: 0;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .workspace {
      width: 100%;
      min-height: 100vh;
      height: 100vh;
      margin: 0 auto;
      padding: 0;
      display: grid;
      align-content: stretch;
      overflow: hidden;
    }

    .nvim {
      min-height: 100vh;
      height: 100vh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      border: 0;
      background: var(--mantle);
      box-shadow: none;
      overflow: hidden;
    }

    .tabline,
    .statusline,
    .cmdline {
      display: flex;
      align-items: center;
      background: var(--surface0);
    }

    .topbar {
      display: none;
    }

    .marks {
      display: inline-flex;
      gap: 7px;
      flex: 0 0 auto;
    }

    .mark {
      width: 8px;
      height: 8px;
      display: block;
      border-radius: 999px;
      background: currentColor;
    }

    .mark:nth-child(1) { color: var(--red); }
    .mark:nth-child(2) { color: var(--yellow); }
    .mark:nth-child(3) { color: var(--green); }

    .address {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--subtext1);
    }

    .tabline {
      min-height: 24px;
      overflow-x: auto;
      background: var(--base);
      border-bottom: 1px solid rgba(0, 191, 255, .18);
    }

    .tabline.is-hidden {
      display: none;
    }

    .tabs {
      display: flex;
      min-width: 0;
      background: var(--base);
    }

    .tab {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px 0 7px;
      border: 0;
      border-left: 2px solid transparent;
      color: var(--subtext0);
      background: var(--base);
      cursor: pointer;
      white-space: nowrap;
      font-size: 12px;
    }

    .tab > span:first-child {
      font-size: 18px;
      line-height: 1;
    }

    .tab.is-active {
      color: var(--text);
      background: #050505;
      border-left-color: var(--peach);
    }

    .tab-close {
      width: 16px;
      height: 16px;
      display: inline-grid;
      place-items: center;
      border: 0;
      color: var(--overlay2);
      background: transparent;
      cursor: pointer;
      font-size: 28px;
      line-height: 1;
      padding: 0;
      margin-top: -4px;
      position: relative;
      top: -4px;
    }

    .tab-close:hover,
    .tab-close:focus-visible {
      color: var(--red);
      outline: 0;
    }

    .empty-tabs {
      padding: 0 12px;
      color: var(--overlay2);
    }

    .main {
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
      overflow: hidden;
      align-self: stretch;
    }

    .main.explorer-hidden {
      grid-template-columns: 0 minmax(0, 1fr);
    }

    .explorer {
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      border-right: 1px solid var(--surface2);
      background: var(--mantle);
      transition: width .16s ease, opacity .16s ease;
    }

    .main.explorer-hidden .explorer {
      width: 0;
      opacity: 0;
      pointer-events: none;
    }

    .explorer-head {
      position: sticky;
      top: 0;
      z-index: 1;
      margin: 10px 10px 0;
      padding: 14px 12px 8px;
      color: var(--subtext1);
      border: 1px solid var(--blue);
      border-radius: 3px;
      background: var(--mantle);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 10px;
      text-transform: none;
    }

    .explorer-title {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      padding: 0 10px;
      color: var(--subtext1);
      background: var(--mantle);
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0;
      pointer-events: none;
    }

    .explorer-filter {
      min-width: 0;
      width: 100%;
      border: 0;
      padding: 0;
      color: var(--text);
      background: transparent;
      outline: 0;
      font: inherit;
      line-height: 1;
    }

    .explorer-count {
      justify-self: end;
      color: var(--overlay2);
      font-size: 13px;
      line-height: 1;
      white-space: nowrap;
    }

    .tree-list {
      margin: 0;
      padding: 8px 0 14px;
      list-style: none;
    }

    .tree-item {
      width: calc(100% - 2px);
      min-height: 24px;
      margin-right: 2px;
      padding: 0 8px 0 10px;
      border: 0;
      display: grid;
      grid-template-columns: max-content max-content 1fr auto;
      align-items: center;
      column-gap: 2px;
      color: var(--subtext1);
      background: transparent;
      text-align: left;
      cursor: pointer;
      line-height: 20px;
    }

    .tree-item:hover,
    .tree-item:focus-visible {
      color: var(--text);
      background: #171923;
      outline: 0;
    }

    .tree-item.is-active {
      color: var(--text);
      background: #101116;
      box-shadow: none;
    }

    .tree-item.is-selected {
      color: var(--text);
      background: #242733;
      box-shadow: none;
    }

    .tree-item.is-folder {
      color: var(--text);
      cursor: pointer;
    }

    .tree-item.is-folder .file-name {
      color: var(--subtext1);
    }

    .tree-indent {
      display: inline-block;
      color: var(--overlay0);
      width: calc(var(--depth, 0) * 16px);
      min-height: 20px;
      margin-right: 1px;
      position: relative;
      flex: 0 0 auto;
    }

    .tree-indent::before {
      content: "";
      display: none;
      position: absolute;
      left: calc(100% - 9px);
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--overlay0);
      opacity: .58;
    }

    .tree-indent::after {
      content: "";
      display: none;
      position: absolute;
      left: calc(100% - 9px);
      top: 10px;
      width: 7px;
      height: 1px;
      background: var(--overlay0);
      opacity: .58;
    }

    .tree-indent.has-guide::before,
    .tree-indent.has-guide::after {
      display: block;
    }

    .tree-item.is-open .file-mark {
      color: var(--green);
    }

    .file-icon {
      min-width: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      line-height: 20px;
      white-space: pre;
    }

    .icon-folder { color: var(--blue); }
    .icon-md { color: var(--blue); }
    .icon-lua { color: var(--sky); }
    .icon-sol { color: var(--lavender); }
    .icon-text { color: var(--green); }
    .icon-git { color: var(--red); }
    .icon-env { color: var(--yellow); }
    .icon-json { color: var(--peach); }
    .icon-toml { color: var(--yellow); }

    .file-name {
      padding-left: 1px;
    }

    .file-mark {
      color: var(--overlay1);
      font-size: 10px;
    }

    .right {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) 150px;
      background: var(--base);
      overflow: hidden;
    }

    .right.no-tabline {
      grid-template-rows: minmax(0, 1fr) 150px;
    }

    .editor,
    .terminal-pane {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--base);
      overflow: hidden;
    }

    .editor {
      position: relative;
      border-bottom: 1px solid var(--surface2);
    }

    .explorer.is-window-active,
    .editor.is-window-active,
    .terminal-pane.is-window-active {
      box-shadow: inset 0 0 0 1px var(--green);
    }

    .winbar {
      min-height: 28px;
      padding: 0 14px;
      color: var(--overlay2);
      border-bottom: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .editor .winbar {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 2;
      width: auto;
      padding-right: 0;
      justify-content: flex-end;
      pointer-events: none;
    }

    .winbar strong {
      color: var(--text);
      font-weight: 700;
    }

    .terminal-pane .winbar {
      display: none;
    }

    .file-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 24px;
      padding: 0 12px;
      color: var(--base);
      background: var(--blue);
      font-weight: 700;
    }

    .buffer {
      min-height: 0;
      overflow: auto;
      padding: 4px 0 12px;
      outline: 0;
    }

    .line {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      min-height: 20px;
      margin-right: 2px;
      padding-right: 16px;
    }

    .line-number {
      padding-right: 12px;
      color: var(--overlay1);
      text-align: right;
      user-select: none;
    }

    .line-text {
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .line.is-cursor {
      background: var(--cursorline);
    }

    .line.is-visual {
      background: rgba(98, 114, 164, 0.18);
    }

    .line.is-cursor .line-number {
      color: var(--blue);
      font-weight: 700;
    }

    .comment { color: var(--overlay2); }
    .keyword { color: var(--mauve); }
    .type { color: var(--blue); }
    .string { color: var(--green); }
    .fn { color: var(--pink); }
    .prop { color: var(--teal); }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .yellow { color: var(--yellow); }
    .mauve { color: var(--mauve); }
    .pink { color: var(--pink); }
    .muted { color: var(--subtext0); }
    .empty { color: var(--overlay2); }

    .statusline {
      display: flex;
      align-items: center;
      gap: 0;
      min-height: 24px;
      color: var(--text);
      background: var(--base);
      border-top: 0;
      overflow: hidden;
    }

    .status-segment {
      position: relative;
      z-index: 1;
      align-self: stretch;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 0 9px;
      color: var(--subtext1);
      background: transparent;
    }

    .status-segment span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-segment.is-muted {
      color: var(--text);
      background: var(--surface0);
    }

    .status-segment.is-black {
      color: var(--text);
      background: var(--base);
    }

    .status-segment.is-orange {
      color: var(--base);
      background: var(--mauve);
      font-weight: 700;
    }

    .status-segment.is-blue {
      color: var(--base);
      background: var(--blue);
      font-weight: 700;
    }

    .status-segment.is-right-block {
      clip-path: polygon(16px 0, 100% 0, 100% 100%, 0 100%);
      padding-left: 25px;
      margin-left: -16px;
    }

    .status-segment.is-red {
      color: var(--base);
      background: var(--red);
      font-weight: 700;
    }

    .status-segment.is-yellow {
      color: var(--base);
      background: var(--yellow);
      font-weight: 700;
    }

    .mode-chip {
      position: relative;
      z-index: 4;
      align-self: stretch;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 22px 0 10px;
      color: var(--base);
      background: var(--blue);
      font-weight: 700;
      clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
      margin-right: -14px;
    }

    .mode-chip.is-insert {
      color: var(--base);
      background: var(--peach);
    }

    .mode-chip span:first-child {
      font-size: 17px;
      line-height: 1;
    }

    /* removed mode-sep — triangle baked into mode-chip via clip-path */

    .status-sep {
      position: relative;
      z-index: 3;
      align-self: stretch;
      display: block;
      width: 16px;
      height: auto;
      flex: 0 0 16px;
    }

    /* from-muted / into-muted removed — triangles baked into sections */

    /* branch "main" section: slanted right edge, tip at top (mirrors is-right-block) */
    .statusline .status-segment.is-muted:not(#leaderState) {
      clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
      padding-left: 18px;
      padding-right: 20px;
      margin-right: -12px;
      z-index: 2;
    }

    /* filename: breathe past the main triangle overlap */
    .statusline .status-segment.is-muted:not(#leaderState) + .status-segment {
      padding-left: 20px;
    }

    /* buffer-count segment: breathe before the % section overlap */
    #bufCountSegment {
      padding-right: 20px;
    }

    /* % section: left-pointing cut (tip at top, mirrors is-right-block) + right padding */
    #leaderState {
      clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%);
      padding-left: 22px;
      padding-right: 22px;
      margin-left: -14px;
    }

    .status-sep.into-blue {
      display: none;
    }

    .status-sep.into-orange {
      display: none;
    }

    .status-sep.into-red {
      background: var(--red);
      clip-path: polygon(66% 0, 100% 0, 100% 100%, 0 100%);
      margin-left: -16px;
      margin-right: 0;
    }

    .status-sep.into-yellow {
      background: var(--yellow);
      clip-path: polygon(66% 0, 100% 0, 100% 100%, 0 100%);
      margin-left: -16px;
      margin-right: 0;
    }


    .status-spacer {
      flex: 1;
    }

    .cmdline {
      position: fixed;
      top: 78px;
      left: 50%;
      transform: translateX(-50%);
      width: min(480px, calc(100vw - 56px));
      min-height: 28px;
      gap: 8px;
      padding: 14px 12px 8px;
      color: var(--subtext1);
      background: var(--mantle);
      border: 1px solid var(--blue);
      border-radius: 3px;
      display: none;
      z-index: 90;
      box-shadow: none;
    }

    .cmdline.is-visible {
      display: flex;
    }

    .cmdline-title {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      padding: 0 10px;
      color: var(--subtext1);
      background: var(--mantle);
      font-size: 15px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0;
      pointer-events: none;
    }

    .terminal-body {
      min-height: 0;
      overflow: auto;
      padding: 6px 2px 16px 12px;
      color: var(--subtext1);
    }

    .terminal-pane.is-broken {
      box-shadow: inset 0 0 0 1px var(--red);
      filter: contrast(1.1) saturate(.9);
    }

    .terminal-pane.is-broken .terminal-body {
      background: linear-gradient(180deg, rgba(255, 107, 107, .08), transparent 60%);
    }

    .page-broken .workspace {
      filter: grayscale(.12) contrast(1.05);
    }

    .page-broken .editor,
    .page-broken .explorer,
    .page-broken .statusline {
      opacity: .28;
    }

    .terminal-command {
      position: absolute;
      inset: auto 0 0 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .terminal-command-input {
      width: 100%;
      min-width: 0;
      border: 0;
      color: var(--text);
      background: transparent;
      outline: 0;
      font: inherit;
    }

    .term-line {
      min-height: 20px;
      margin-right: 2px;
      padding-right: 10px;
      white-space: pre-wrap;
    }

    .term-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-height: 20px;
    }

    .term-row .up {
      color: var(--green);
    }

    .term-row .down {
      color: var(--red);
    }

    .term-row .flat {
      color: var(--overlay2);
    }

    .term-label {
      color: var(--text);
      font-weight: 700;
      white-space: nowrap;
    }

    .term-price {
      color: var(--text);
      text-align: right;
      white-space: nowrap;
    }

    .term-meta {
      color: var(--overlay2);
      white-space: nowrap;
    }

    .cmd-prefix {
      color: var(--blue);
    }

    .term-prompt {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .term-arrow {
      color: var(--text);
      font-weight: 700;
    }

    .term-user {
      color: #00f0ff;
      font-weight: 700;
    }

    .term-git {
      color: var(--blue);
      font-weight: 700;
    }

    .term-branch {
      color: var(--red);
      font-weight: 700;
    }

    .term-input {
      min-width: 0;
      color: var(--text);
      white-space: pre;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .term-cursor {
      color: var(--text);
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .cmd-input {
      width: 100%;
      min-width: 0;
      border: 0;
      color: var(--text);
      background: transparent;
      outline: 0;
    }

    .msg {
      margin-left: auto;
      color: var(--overlay2);
      white-space: nowrap;
    }

    .cmd-menu {
      position: fixed;
      top: 128px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 91;
      width: min(480px, calc(100vw - 56px));
      margin: 0;
      padding: 4px 0;
      list-style: none;
      color: var(--subtext1);
      background: var(--mantle);
      border: 1px solid var(--blue);
      border-radius: 3px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .42);
    }

    .cmd-menu[hidden] {
      display: none;
    }

    .cmd-menu-item {
      min-height: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      color: var(--subtext1);
      cursor: pointer;
    }

    .cmd-menu-item.is-selected,
    .cmd-menu-item:hover {
      color: var(--text);
      background: var(--cursorline);
    }

    .cmd-menu-kind {
      color: var(--purple);
      font-size: 12px;
      margin-left: auto;
    }

    .which-key {
      position: fixed;
      right: 12px;
      top: auto;
      bottom: 34px;
      z-index: 10;
      width: min(296px, calc(100% - 24px));
      max-height: min(360px, calc(100vh - 86px));
      padding: 18px 0 5px;
      background: var(--base);
      box-shadow: -18px 0 42px rgba(0,0,0,.46);
      overflow: visible;
    }

    .which-key::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid var(--blue);
      box-shadow: inset 0 0 0 1px rgba(0,191,255,.45);
      border-radius: 3px;
      pointer-events: none;
    }

    .which-key::after {
      content: "␣";
      position: absolute;
      top: -14px;
      left: 8px;
      width: 30px;
      height: 20px;
      padding: 0;
      color: var(--text);
      background: var(--base);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      line-height: 1;
      font-weight: 700;
      text-align: center;
      border-radius: 1px;
      pointer-events: none;
    }

    .which-key[hidden] {
      display: none;
    }

    .yank-toast {
      position: fixed;
      right: 18px;
      top: 18px;
      z-index: 30;
      min-width: 220px;
      padding: 0;
      color: var(--text);
      background: var(--base);
      border: 1px solid var(--surface2);
      box-shadow: 0 0 0 1px var(--blue);
      text-align: left;
      font: 700 13px/1 var(--mono);
      pointer-events: none;
      overflow: hidden;
    }

    .yank-toast-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 26px;
      padding: 0 12px;
      border-bottom: 1px solid var(--surface2);
      color: var(--text);
      font-weight: 700;
    }

    .yank-toast-head .icon {
      font-size: 18px;
      line-height: 1;
      color: var(--blue);
    }

    .yank-toast-body {
      padding: 10px 16px;
      text-align: left;
    }

    .yank-toast[hidden] {
      display: none;
    }

    .markdown-preview {
      position: fixed;
      inset: 48px 58px 52px;
      z-index: 110;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      color: var(--text);
      background: var(--base);
      border: 1px solid var(--blue);
      border-radius: 3px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .58);
      overflow: hidden;
    }

    .markdown-preview[hidden] {
      display: none;
    }

    .markdown-preview-head {
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border-bottom: 1px solid var(--surface2);
      color: var(--subtext1);
      background: var(--mantle);
    }

    .markdown-preview-title {
      color: var(--text);
      font-weight: 700;
    }

    .markdown-preview-close {
      margin-left: auto;
      border: 0;
      color: var(--overlay2);
      background: transparent;
      font: 700 22px/1 var(--mono);
      cursor: pointer;
    }

    .markdown-preview-body {
      min-height: 0;
      overflow: auto;
      padding: 22px 28px 30px;
      font: 14px/1.55 var(--mono);
      outline: 0;
    }

    .markdown-preview-body h1,
    .markdown-preview-body h2,
    .markdown-preview-body h3 {
      margin: 0 0 12px;
      color: var(--text);
      line-height: 1.2;
    }

    .markdown-preview-body h1 { font-size: 24px; }
    .markdown-preview-body h2 { font-size: 19px; margin-top: 22px; }
    .markdown-preview-body h3 { font-size: 16px; margin-top: 18px; }

    .markdown-preview-body p,
    .markdown-preview-body ul,
    .markdown-preview-body ol,
    .markdown-preview-body pre {
      margin: 0 0 12px;
    }

    .markdown-preview-body code {
      color: var(--green);
      background: var(--mantle);
      padding: 1px 4px;
    }

    .markdown-preview-body pre {
      padding: 12px;
      overflow: auto;
      background: var(--mantle);
      border: 1px solid var(--surface2);
    }

    .wk-title {
      display: none;
    }

    .wk-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      margin-top: 1px;
      max-height: min(320px, calc(100vh - 128px));
      overflow: auto;
      padding-top: 6px;
    }

    .wk-row {
      min-width: 0;
      display: grid;
      grid-template-columns: 18px 8px 24px minmax(0, 1fr);
      gap: 0;
      min-height: 16px;
      padding: 0 6px 0 10px;
      align-items: center;
      color: var(--subtext1);
    }

    .wk-row:hover {
      background: var(--cursorline);
    }

    .wk-key {
      color: var(--text);
      text-align: left;
      font-weight: 700;
    }

    .wk-arrow {
      color: var(--overlay1);
      text-align: center;
      font-size: 12px;
    }

    .wk-icon {
      text-align: center;
      font-size: 20px;
      line-height: 1;
    }

    .wk-icon.is-blue { color: var(--blue); }
    .wk-icon.is-sky { color: var(--sky); }
    .wk-icon.is-green { color: var(--green); }
    .wk-icon.is-mauve { color: var(--mauve); }
    .wk-icon.is-peach { color: var(--peach); }
    .wk-icon.is-yellow { color: var(--yellow); }
    .wk-icon.is-red { color: var(--red); }
    .wk-icon.is-teal { color: var(--teal); }
    .wk-icon.is-pink { color: var(--pink); }
    .wk-icon.is-lavender { color: var(--lavender); }
    .wk-icon.is-flamingo { color: var(--flamingo); }
    .wk-icon.is-maroon { color: var(--maroon); }
    .wk-icon.is-overlay { color: var(--overlay1); }

    .wk-desc {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--pink);
    }

    .wk-footer {
      display: flex;
      gap: 10px;
      padding: 2px 14px 0;
      margin-top: 1px;
      color: var(--overlay0);
      font-size: 11px;
    }

    .wk-footer kbd {
      color: var(--overlay2);
      font: inherit;
    }

    @media (max-width: 780px) {
      .workspace {
        width: 100%;
        padding: 0;
        align-content: start;
      }

      .nvim {
        min-height: 100vh;
      }

      .main {
        grid-template-columns: 1fr;
      }

      .main:not(.explorer-hidden) {
        grid-template-rows: 178px minmax(0, 1fr);
      }

      .right {
        grid-template-rows: minmax(0, 1fr) 132px;
      }

      .explorer {
        border-right: 0;
        border-bottom: 1px solid var(--overlay0);
      }

      .main.explorer-hidden {
        grid-template-columns: 1fr;
      }

      .main.explorer-hidden .explorer {
        display: none;
      }

      .tree-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .status-segment.optional,
      .status-sep.into-muted,
      .msg {
        display: none;
      }

      .line {
        grid-template-columns: 40px minmax(0, 1fr);
      }

      .wk-grid {
        grid-template-columns: 1fr;
      }

      .which-key {
        right: 8px;
        left: 8px;
        bottom: 34px;
        width: auto;
        height: auto;
        max-height: min(320px, calc(100vh - 72px));
      }
    }
  </style>
</head>

  <main class="workspace" aria-label="zakrad LazyVim portfolio">
    <section class="nvim" aria-label="interactive fake Neovim editor">
      <div class="main" id="main">
        <aside class="explorer" id="explorer" aria-label="file explorer" tabindex="0">
          <div class="explorer-head">
            <span class="explorer-title">Explorer</span>
            <input class="explorer-filter" id="explorerFilter" autocomplete="off" spellcheck="false" aria-label="filter files and folders">
            <span class="explorer-count" id="explorerCount">0/0</span>
          </div>
          <ul class="tree-list" id="tree"></ul>
        </aside>

        <div class="right" id="rightPane">
          <div class="tabline" id="tabline" aria-label="buffers">
            <div class="tabs" id="tabs"></div>
          </div>

          <section class="editor" id="editorPane" aria-live="polite">
            <div class="winbar" id="winbar"></div>
            <div class="buffer" id="buffer" tabindex="0" aria-label="editor buffer"></div>
          </section>

          <section class="terminal-pane" id="terminalPane" aria-label="terminal split">
            <div class="winbar"><strong>zsh</strong> term://wezterm/tmux</div>
            <div class="terminal-body" id="terminalBody" tabindex="0"></div>
            <form class="terminal-command" id="terminalCommandForm">
              <span class="cmd-prefix">➜</span>
              <input class="terminal-command-input" id="terminalCommand" autocomplete="off" spellcheck="false" aria-label="terminal command">
            </form>
          </section>
        </div>
      </div>

      <footer class="statusline">
        <span class="mode-chip"><span></span><span id="mode">NORMAL</span></span>
        <span class="status-segment is-muted"><span></span><span id="branch">main</span></span>
        <span class="status-segment is-black optional"><span id="statusFileIcon"></span><span id="statusFileName">README.md</span></span>
        <span class="status-segment" id="filetype">markdown</span>
        <span class="status-segment optional"><span class="yellow">󰆧</span><span>Portfolio</span></span>
        <span class="status-spacer"></span>
        <span class="status-segment optional" id="recentKeysSegment"><span class="mauve" id="recentKeys">SPC</span></span>
        <span class="status-segment optional" id="bufCountSegment"><span class="pink" style="font-size:17px;line-height:1">⬡</span><span id="bufCount">1</span></span>
        <span class="status-segment is-muted optional" id="leaderState">0%</span>
        <span class="status-segment is-blue is-right-block"><span id="position">1:1</span><span style="margin-left:7px;font-size:17px;line-height:1;opacity:.85">≡</span></span>
      </footer>

      <form class="cmdline" id="commandForm">
        <span class="cmdline-title">Cmdline</span>
        <input class="cmd-input" id="command" autocomplete="off" spellcheck="false" aria-label="vim command">
        <span class="msg" id="message" hidden>press Space</span>
      </form>
      <ul class="cmd-menu" id="commandMenu" hidden></ul>
    </section>
  </main>

  <section class="which-key" id="whichKey" hidden aria-label="leader key menu">
    <div class="wk-title">
      <span id="wkTitle">SPC</span>
      <span>which-key</span>
    </div>
    <div class="wk-grid" id="wkGrid"></div>
  </section>

  <div class="yank-toast" id="yankToast" hidden></div>

  <section class="markdown-preview" id="markdownPreview" hidden aria-label="markdown preview">
    <div class="markdown-preview-head">
      <span></span>

      "dotfiles/README.md": {
        type: "markdown",
        icon: "",
        lines: [
          ["# dotfiles setup"],
          [""],
          ["This tree is meant to be used as a shareable dotfiles bundle."],
          [""],
          ["## Requirements"],
          ["- Neovim 0.9+ with Lua support"],
          ["- `git`"],
          ["- `lazy.nvim` bootstrap access"],
          ["- a Nerd Font for icons"],
          [""],
          ["## Layout"],
          ["- `dotfiles/nvim` contains the Neovim config"],
          ["- `dotfiles/shell` contains shell config"],
          ["- `dotfiles/wezterm` contains terminal config"],
          ["- `dotfiles/tmux` contains tmux config"],
          [""],
          ["## Neovim"],
          ["- `nvim/config/init.lua` bootstraps the config"],
          ["- `nvim/config/lua/config/*` holds core options and keymaps"],
          ["- `nvim/config/lua/plugins/*` holds plugin specs"],
          [""],
          ["## Setup"],
          ["1. Copy or symlink `dotfiles/nvim/config` to `~/.config/nvim`."],
          ["2. Run Neovim once so `lazy.nvim` can bootstrap."],
          ["3. Run `:Lazy sync` and `:Mason` if you want the language servers and tools."],
          ["4. Keep any machine-specific paths outside the shared config."],
          [""],
          ["## Notes"],
          ["- Shell paths and local binaries should be replaced with `$HOME`-relative values."],
          ["- The tree only includes files that are safe to share publicly."],
          [""],
          ["## Path changes"],
          ["- before: `/Users/you/.huff/bin`"],
          ["- after:  `$HOME/.huff/bin`"],
          ["- before: `/Users/you/.nvm/versions/node/...`"],
          ["- after:  `$HOME/.nvm/versions/node/...`"],
          [""],
          ["## Shell and terminal"],
          ["- `.zshrc` should keep generic exports and avoid user-specific tool paths."],
          ["- Replace any hard-coded install locations with `$HOME`-based paths."],
          ["- `wezterm.lua` is safe to share when it only describes display settings, tmux startup, and key bindings."],
          ["- If `wezterm.lua` points to local binaries or special font files, swap those to portable values."],
          [""],
          ["## Tmux"],
          ["- `tmux` uses `~/.tmux.conf` by default."],
          ["- If your config lives elsewhere, start tmux with `tmux -f /path/to/.tmux.conf`."],
          ["- Change any hard-coded helper script path to a `$HOME`-relative path before using it on another machine."],
          ["- If a `bind` or `run-shell` command calls a local file, update that path to match the new machine."],
          [""],
        ]
      },

        type: "lua",
        icon: "",
        lines: [
          ["-- ==========================="],
          ["-- Rust: auto-format on save (cargo fmt)"],
          ["-- ==========================="],
          ["vim.api.nvim_create_autocmd(\"BufWritePre\", {"],
          ["  group = vim.api.nvim_create_augroup(\"RustFormatGroup\", {}),"],
          ["  pattern = \"*.rs\","],
          ["  callback = function()"],
          ["    if vim.fn.filereadable(\"Cargo.toml\") == 1 then"],
          ["      vim.cmd(\"silent! !cargo fmt\")"],
          ["    end"],
          ["  end,"],
          ["})"],
          [""],
          ["-- ==========================="],
          ["-- Highlight on yank (all files)"],
          ["-- ==========================="],
          ["local highlight_yank_group = vim.api.nvim_create_augroup(\"HighlightYankGroup\", {})"],
          ["vim.api.nvim_create_autocmd(\"TextYankPost\", {"],
          ["  group = highlight_yank_group,"],
          ["  callback = function()"],
          ["    vim.highlight.on_yank()"],
          ["  end,"],
          ["})"],
          [""],
        ]
      },

          ["  local out = vim.fn.system({ \"git\", \"clone\", \"--filter=blob:none\", \"--branch=stable\", lazyrepo, lazypath })"],
          ["  if vim.v.shell_error ~= 0 then"],
          ["    vim.api.nvim_echo({"],
          ["      { \"Failed to clone lazy.nvim:\\n\", \"ErrorMsg\" },"],
          ["      { out, \"WarningMsg\" },"],
          ["      { \"\\nPress any key to exit...\" },"],
          ["    }, true, {})"],
          ["    vim.fn.getchar()"],
          ["    os.exit(1)"],
          ["  end"],
          ["end"],

      "nvim/config/lua/plugins/amp.lua": {
        type: "lua",
        icon: "",
        lines: [
          ["return {"],
          ["  {"],
          ["    \"sourcegraph/amp.nvim\","],
          ["    enabled = false,"],
          ["    branch = \"main\","],
          ["    lazy = false,"],
          ["    opts = {"],
          ["      auto_start = true,"],
          ["      log_level = \"info\","],
          ["    },"],
          ["    config = function(_, opts)"],
          ["      require(\"amp\").setup(opts)"],
          [""],
          ["      -- Optional: handy commands"],
          ["      vim.api.nvim_create_user_command(\"AmpSend\", function(cmdopts)"],
          ["        local msg = cmdopts.args"],
          ["        if msg == \"\" then"],
          ["          vim.notify(\"Usage: :AmpSend <message>\", vim.log.levels.WARN)"],
          ["          return"],
          ["        end"],
          ["        require(\"amp.message\").send_message(msg)"],
          ["      end, { nargs = \"*\", desc = \"Send a message to Amp\" })"],
          [""],
          ["      vim.api.nvim_create_user_command(\"AmpPromptSelection\", function(cmdopts)"],
          ["        local lines = vim.api.nvim_buf_get_lines(0, cmdopts.line1 - 1, cmdopts.line2, false)"],
          ["        local text = table.concat(lines, \"\\n\")"],
          ["        require(\"amp.message\").send_to_prompt(text)"],
          ["      end, { range = true, desc = \"Add selected text to Amp prompt\" })"],
          [""],
          ["      vim.api.nvim_create_user_command(\"AmpPromptRef\", function(cmdopts)"],
          ["        local bufname = vim.api.nvim_buf_get_name(0)"],
          ["        if bufname == \"\" then"],
          ["          vim.notify(\"Current buffer has no filename\", vim.log.levels.WARN)"],
          ["          return"],
          ["        end"],
          ["        local rel = vim.fn.fnamemodify(bufname, \":.\")"],
          ["        local ref = \"@\" .. rel"],
          ["        if cmdopts.line1 ~= cmdopts.line2 then"],
          ["          ref = ref .. \"#L\" .. cmdopts.line1 .. \"-\" .. cmdopts.line2"],
          ["        elseif cmdopts.line1 > 1 then"],
          ["          ref = ref .. \"#L\" .. cmdopts.line1"],
          ["        end"],
          ["        require(\"amp.message\").send_to_prompt(ref)"],
          ["      end, { range = true, desc = \"Add file reference (with selection) to Amp prompt\" })"],
          [""],
          ["      -- Optional: keymaps (LazyVim convention uses <leader>)"],
          ["      -- Visual: send selection to Amp prompt"],
          ["      vim.keymap.set(\"v\", \"<leader>a\", \":AmpPromptSelection<CR>\", { desc = \"Amp: prompt selection\" })"],
          ["      -- Visual: send file reference + range"],
          ["      vim.keymap.set(\"v\", \"<leader>A\", \":AmpPromptRef<CR>\", { desc = \"Amp: prompt file ref\" })"],
          ["    end,"],
          ["  },"],
          ["}"],
          [""],
        ]
      },

      "nvim/config/lua/plugins/example.lua": {
        type: "lua",

        lines: [
          ["-- since this is just an example spec, don't actually load anything here and return an empty spec"],

          ["-- every spec file under the \"plugins\" directory will be loaded automatically by lazy.nvim"],

          ["-- In your plugin files, you can:"],
          ["-- * add extra plugins"],

          ["-- * override the configuration of LazyVim plugins"],
          ["return {"],
          ["  -- add gruvbox"],
          ["  { \"ellisonleao/gruvbox.nvim\" },"],
          [""],
          ["  -- Configure LazyVim to load gruvbox"],
          ["  {"],
          ["    \"LazyVim/LazyVim\","],
          ["    opts = {"],
          ["      colorscheme = \"gruvbox\","],
          ["    },"],
          ["  },"],
          [""],
          ["  -- change trouble config"],

          ["    -- opts will be merged with the parent spec"],
          ["    opts = { use_diagnostic_signs = true },"],

          [""],
          ["  -- disable trouble"],
          ["  { \"folke/trouble.nvim\", enabled = false },"],
          [""],

          ["  {"],
          ["    \"hrsh7th/nvim-cmp\","],
          ["    dependencies = { \"hrsh7th/cmp-emoji\" },"],
          ["    ---@param opts cmp.ConfigSchema"],
          ["    opts = function(_, opts)"],

          ["  -- change some telescope options and a keymap to browse plugin files"],
          ["  {"],
          ["    \"nvim-telescope/telescope.nvim\","],
          ["    keys = {"],
          ["      -- add a keymap to browse plugin files"],
          ["      -- stylua: ignore"],
          ["      {"],
          ["        \"<leader>fp\","],
          ["        function() require(\"telescope.builtin\").find_files({ cwd = require(\"lazy.core.config\").options.root }) end,"],
          ["        desc = \"Find Plugin File\","],
          ["      },"],
          ["    },"],
          ["    -- change some options"],
          ["    opts = {"],
          ["      defaults = {"],
          ["        layout_strategy = \"horizontal\","],
          ["        layout_config = { prompt_position = \"top\" },"],
          ["        sorting_strategy = \"ascending\","],

          ["        require(\"lazyvim.util\").lsp.on_attach(function(_, buffer)"],

          ["        end)"],

          ["    ---@class PluginLspOpts"],

      "nvim/config/lua/plugins/lualine.lua": {
        type: "lua",
        icon: "",
        lines: [
          ["local util = require(\"lazyvim.util\")"],
          [""],
          ["local function format(component, text, hl_group)"],
          ["  if not hl_group then"],
          ["    return text"],
          ["  end"],
          [""],
          ["  ---@type table<string, string>"],
          ["  component.hl_cache = component.hl_cache or {}"],
          ["  local lualine_hl_group = component.hl_cache[hl_group]"],
          ["  if not lualine_hl_group then"],
          ["    local utils = require(\"lualine.utils.utils\")"],
          ["    local mygui = function()"],
          ["      local mybold = utils.extract_highlight_colors(hl_group, \"bold\") and \"bold\""],
          ["      local myitalic = utils.extract_highlight_colors(hl_group, \"italic\") and \"italic\""],
          ["      if mybold and myitalic then"],
          ["        return mybold .. \",\" .. myitalic"],
          ["      elseif mybold then"],
          ["        return mybold"],
          ["      elseif myitalic then"],
          ["        return myitalic"],
          ["      else"],
          ["        return \"\""],
          ["      end"],
          ["    end"],
          [""],
          ["    lualine_hl_group = component:create_hl({"],
          ["      fg = utils.extract_highlight_colors(hl_group, \"fg\"),"],
          ["      gui = mygui(),"],
          ["    }, \"LV_\" .. hl_group)"],
          ["    component.hl_cache[hl_group] = lualine_hl_group"],
          ["  end"],
          ["  return component:format_hl(lualine_hl_group) .. text .. component:get_default_hl()"],
          ["end"],
          [""],
          ["local function pretty_path(opts)"],
          ["  opts = vim.tbl_extend(\"force\", {"],
          ["    relative = \"cwd\","],
          ["    modified_hl = \"MatchParen\","],
          ["    filename_hl = \"Bold\","],
          ["    dirpath_hl = \"Conceal\","],
          ["  }, opts or {})"],
          [""],
          ["  return function(self)"],
          ["    local path = vim.fn.expand(\"%:p\") --[[@as string]]"],
          ["    if path == \"\" then"],
          ["      return \"\""],
          ["    end"],
          [""],
          ["    local root = util.root.get({ normalize = true })"],
          ["    local cwd = util.root.cwd()"],
          [""],
          ["    if opts.relative == \"cwd\" and path:find(cwd, 1, true) == 1 then"],
          ["      path = path:sub(#cwd + 2)"],
          ["    else"],
          ["      path = path:sub(#root + 2)"],
          ["    end"],
          [""],
          ["    local sep = package.config:sub(1, 1)"],
          ["    local parts = vim.split(path, \"[\\\\/]\")"],
          [""],
          ["    if #parts > 3 then"],
          ["      parts = { parts[1], \"…\", parts[#parts - 1], parts[#parts] }"],
          ["    end"],
          [""],
          ["    if opts.modified_hl and vim.bo.modified then"],
          ["      parts[#parts] = format(self, parts[#parts], opts.modified_hl)"],
          ["    else"],
          ["      parts[#parts] = format(self, parts[#parts], opts.filename_hl)"],
          ["    end"],
          [""],
          ["    local dirpath = \"\""],
          ["    if #parts > 1 then"],
          ["      dirpath = table.concat({ unpack(parts, 1, #parts - 1) }, sep)"],
          ["      dirpath = format(self, dirpath .. sep, opts.dirpath_hl)"],
          ["    end"],
          ["    return dirpath .. parts[#parts]"],
          ["  end"],
          ["end"],
          [""],
          ["return {"],
          ["  {"],
          ["    \"nvim-lualine/lualine.nvim\","],
          ["    opts = function(_, opts)"],
          ["      opts.options = {"],
          ["        section_separators = { left = \"\", right = \"\" },"],
          ["        component_separators = { left = \"\", right = \"\" },"],
          ["      }"],
          ["      opts.sections.lualine_a = {"],
          ["        {"],
          ["          function()"],
          ["            return \"\""],
          ["          end,"],
          ["          padding = { left = 1, right = 0 },"],
          ["          separator = \"\","],
          ["        },"],
          ["        \"mode\","],
          ["      }"],
          ["      opts.sections.lualine_c[4] = { pretty_path() }"],
          ["      opts.sections.lualine_y = { \"progress\" }"],
          ["      opts.sections.lualine_z = {"],
          ["        { \"location\", separator = \"\" },"],
          ["        {"],
          ["          function()"],
          ["            return \"\""],
          ["          end,"],
          ["          padding = { left = 0, right = 1 },"],
          ["        },"],
          ["      }"],
          ["      return opts"],
          ["    end,"],
          ["  },"],
          ["}"],
          [""],
        ]
      },

    function renderLine(parts) {

        if (classes.has(parts[i]) && i + 1 < parts.length) {
          html += `<span class="${parts[i]}">${escapeHtml(parts[i + 1])}</span>`;
          i += 1;

        }

    function renderMarkdownPreview(markdown) {
      const lines = markdown.split("\n");
      let html = "";
      let list = "";
      let listType = "";
      let inCode = false;
      let code = [];

      const closeList = () => {
        if (!list) return;
        html += `<${listType}>${list}</${listType}>`;
        list = "";
        listType = "";
      };

      const closeCode = () => {
        if (!inCode) return;
        html += `<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`;
        code = [];
        inCode = false;
      };

      for (const rawLine of lines) {
        const line = rawLine.trimEnd();
        if (line.startsWith("```")) {
          if (inCode) closeCode();
          else {
            closeList();
            inCode = true;
          }
          continue;
        }

        if (inCode) {
          code.push(rawLine);
          continue;
        }

        if (!line.trim()) {
          closeList();
          continue;
        }

        const heading = line.match(/^(#{1,3})\s+(.*)$/);
        if (heading) {
          closeList();
          const level = heading[1].length;
          html += `<h${level}>${escapeHtml(heading[2])}</h${level}>`;
          continue;
        }

        const bullet = line.match(/^[-*]\s+(.*)$/);
        if (bullet) {
          if (listType && listType !== "ul") closeList();
          listType = "ul";
          list += `<li>${escapeHtml(bullet[1])}</li>`;
          continue;
        }

        const numbered = line.match(/^\d+\.\s+(.*)$/);
        if (numbered) {
          if (listType && listType !== "ol") closeList();
          listType = "ol";
          list += `<li>${escapeHtml(numbered[1])}</li>`;
          continue;
        }

        closeList();
        html += `<p>${escapeHtml(line).replace(/`([^`]+)`/g, "<code>$1</code>")}</p>`;
      }

      closeCode();
      closeList();
      return html || "<p>Empty markdown file.</p>";
    }

    function renderSyntaxLine(fileType, raw) {
      const text = String(raw || "");
      if (fileType === "lua") {
        const keywords = new Set([
          "and", "break", "do", "else", "elseif", "end", "false", "for", "function",
          "if", "in", "local", "nil", "not", "or", "repeat", "return", "then",
          "true", "until", "while", "require", "vim", "setup", "config"
        ]);
        let html = "";
        for (let i = 0; i < text.length;) {
          const ch = text[i];
          const next = text[i + 1];

          if (ch === "-" && next === "-") {
            html += `<span class="comment">${escapeHtml(text.slice(i))}</span>`;
            break;
          }

          if (ch === "\"" || ch === "'") {
            const quote = ch;
            let j = i + 1;
            let escaped = false;
            while (j < text.length) {
              const c = text[j];
              if (!escaped && c === quote) {
                j += 1;
                break;
              }
              escaped = !escaped && c === "\\";
              j += 1;
            }
            html += `<span class="string">${escapeHtml(text.slice(i, j))}</span>`;
            i = j;
            continue;
          }

          if (/\s/.test(ch)) {
            let j = i + 1;
            while (j < text.length && /\s/.test(text[j])) j += 1;
            html += escapeHtml(text.slice(i, j));
            i = j;
            continue;
          }

          if (/[A-Za-z_]/.test(ch)) {
            let j = i + 1;
            while (j < text.length && /[A-Za-z0-9_]/.test(text[j])) j += 1;
            const word = text.slice(i, j);
            if (keywords.has(word)) {
              html += `<span class="keyword">${escapeHtml(word)}</span>`;
            } else {
              html += escapeHtml(word);
            }
            i = j;
            continue;
          }

          if (/\d/.test(ch)) {
            let j = i + 1;
            while (j < text.length && /[\d.]/.test(text[j])) j += 1;
            html += `<span class="yellow">${escapeHtml(text.slice(i, j))}</span>`;
            i = j;
            continue;
          }

          html += escapeHtml(ch);
          i += 1;
        }
        return html;
      }

      if (fileType === "shell") {
        const keywords = new Set([
          "export", "source", "typeset", "local", "unset", "exec", "if", "then",
          "else", "fi", "case", "esac", "while", "do", "done", "for", "in",
          "function", "readonly"
        ]);
        let html = "";
        for (let i = 0; i < text.length;) {
          const ch = text[i];
          const next = text[i + 1];

          if (ch === "#") {
            html += `<span class="comment">${escapeHtml(text.slice(i))}</span>`;
            break;
          }

          if (ch === "\"" || ch === "'") {
            const quote = ch;
            let j = i + 1;
            let escaped = false;
            while (j < text.length) {
              const c = text[j];
              if (!escaped && c === quote) {
                j += 1;
                break;
              }
              escaped = !escaped && c === "\\";
              j += 1;
            }
            html += `<span class="string">${escapeHtml(text.slice(i, j))}</span>`;
            i = j;
            continue;
          }

          if (/\s/.test(ch)) {
            let j = i + 1;
            while (j < text.length && /\s/.test(text[j])) j += 1;
            html += escapeHtml(text.slice(i, j));
            i = j;
            continue;
          }

          if (/[A-Za-z_]/.test(ch)) {
            let j = i + 1;
            while (j < text.length && /[A-Za-z0-9_]/.test(text[j])) j += 1;
            const word = text.slice(i, j);
            html += keywords.has(word)
              ? `<span class="keyword">${escapeHtml(word)}</span>`
              : escapeHtml(word);
            i = j;
            continue;
          }

          if (ch === "$") {
            let j = i + 1;
            if (text[j] === "{") {
              j += 1;
              while (j < text.length && text[j] !== "}") j += 1;
              if (text[j] === "}") j += 1;
            } else {
              while (j < text.length && /[A-Za-z0-9_]/.test(text[j])) j += 1;
            }
            html += `<span class="prop">${escapeHtml(text.slice(i, j))}</span>`;
            i = j;
            continue;
          }

          html += escapeHtml(ch);
          i += 1;
        }
        return html;
      }

      return escapeHtml(text);
    }

    function visibleTreeNodes() {

        const nodes = [];
        for (const node of childrenOf(parentPath)) {
          if (node.kind === "folder") {
            const nodeMatches = !query || matchesTreeNode(node, query);
            const expanded = state.expanded.includes(node.path);
            if (searchMode) {
              const descendants = collect(node.path, true);
              if (nodeMatches || descendants.length) {
                nodes.push(node, ...descendants);

            } else {
              nodes.push(node);
              if (expanded) {
                nodes.push(...collect(node.path, false));
              }
            }
          } else if (matchesTreeNode(node, query)) {
            nodes.push(node);
          }
        }
        return nodes;
      };

      if (!query) return collect(undefined, false);

      return collect(undefined, true);
    }

    async function ensureCoinbaseProducts() {
      if (state.terminal.productsLoaded) return state.terminal.products;
      if (!state.terminal.productsPromise) {
        state.terminal.productsPromise = fetch("https://api.exchange.coinbase.com/products", {
          headers: { accept: "application/json" }
        })
          .then((response) => {
            if (!response.ok) throw new Error(`products HTTP ${response.status}`);
            return response.json();
          })
          .then((products) => {
            state.terminal.products = (Array.isArray(products) ? products : [])
              .filter((product) => product?.status === "online");
            state.terminal.productsLoaded = true;
            return state.terminal.products;
          })
          .catch((error) => {
            state.terminal.productsLoaded = false;
            state.terminal.products = [];
            throw error;
          })
          .finally(() => {
            state.terminal.productsPromise = null;
          });
      }

      return state.terminal.productsPromise;
    }

    function resolveCoinbaseProduct(query) {
      const normalized = query.trim().toUpperCase();
      if (!normalized) return null;

      const products = state.terminal.products;
      const directId = products.find((product) => product.id === normalized || product.id === normalized.replace("/", "-"));
      if (directId) return directId;

      const pairId = normalized.replace("/", "-");
      const directPair = products.find((product) => product.id === pairId);
      if (directPair) return directPair;

      const [base, quote] = normalized.split(/[\s/-]+/).filter(Boolean);
      if (base && quote) {
        const exactPair = products.find((product) => product.base_currency === base && product.quote_currency === quote);
        if (exactPair) return exactPair;
      }

      const candidates = products.filter((product) => product.base_currency === normalized);
      if (!candidates.length) return null;

      for (const quoteCurrency of coinbaseQuoteOrder) {
        const preferred = candidates.find((product) => product.quote_currency === quoteCurrency);
        if (preferred) return preferred;
      }

      return candidates[0];
    }

    async function fetchCoinbaseTicker(query) {
      const symbol = query.trim();
      if (!symbol) return { error: "missing ticker" };

      try {
        await ensureCoinbaseProducts();
        const product = resolveCoinbaseProduct(symbol);
        if (!product) {
          return { error: `no Coinbase pair found for ${symbol}` };
        }

        const response = await fetch(`https://api.exchange.coinbase.com/products/${encodeURIComponent(product.id)}/ticker`, {
          headers: { accept: "application/json" }
        });

        if (!response.ok) {
          return { error: `ticker HTTP ${response.status}` };
        }

        const data = await response.json();
        return {
          product,
          price: data.price,
          bid: data.bid,
          ask: data.ask,
          volume: data.volume,
          time: data.time
        };
      } catch (error) {
        return { error: error instanceof Error ? error.message : "ticker lookup failed" };
      }
    }

    async function ensureKrakenPairs() {
      if (state.terminal.krakenPairsLoaded) return state.terminal.krakenPairs;
      if (!state.terminal.krakenPairsPromise) {
        state.terminal.krakenPairsPromise = fetch("https://api.kraken.com/0/public/AssetPairs")
          .then((response) => {

            return response.json();

            state.terminal.krakenPairs = Object.entries(result).map(([key, pair]) => ({

              altname: pair?.altname || key,
              wsname: pair?.wsname || "",
              base: pair?.base || "",
              quote: pair?.quote || "",
              status: pair?.status || ""
            })).filter((pair) => pair.status !== "delisted");
            state.terminal.krakenPairsLoaded = true;
