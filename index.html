    function resolveKrakenPair(query) {
      const normalized = normalizeKrakenSymbol(query);
      if (!normalized) return null;

      const pairs = state.terminal.krakenPairs;
      const quoteOrder = ["USD", "USDT", "EUR", "GBP", "BTC", "XBT", "CAD", "AUD"];
      const aliasMap = { BTC: "XBT", XBT: "XBT" };
      const normalizeBase = (value) => aliasMap[value] || value;

      const parts = normalized.split(/[\s/-]+/).filter(Boolean);
      const baseOnly = normalizeBase(parts[0] || normalized);
      const requestedQuote = normalizeBase(parts[1] || "");

      const pairVariants = new Set([
        normalized,
        normalized.replace("/", ""),
        normalized.replace("/", "-"),
        normalized.replace("-", ""),
        normalized.replaceAll("_", "")
      ]);

      const direct = pairs.find((pair) =>
        pairVariants.has(pair.altname?.toUpperCase()) ||
        pairVariants.has((pair.wsname || "").toUpperCase()) ||
        pairVariants.has(pair.key.toUpperCase())
      );
      if (direct) return direct;

      const baseMatches = pairs.filter((pair) => {
        const altname = normalizeBase((pair.altname || "").toUpperCase());
        const wsname = normalizeBase((pair.wsname || "").toUpperCase());
        return altname.startsWith(baseOnly) || wsname.startsWith(`${baseOnly}/`);
      });
      if (!baseMatches.length) return null;

      if (requestedQuote) {
        const requested = baseMatches.find((pair) => {
          const altname = (pair.altname || "").toUpperCase();
          const wsname = (pair.wsname || "").toUpperCase();
          return altname.endsWith(requestedQuote) || wsname.endsWith(`/${requestedQuote}`);
        });
        if (requested) return requested;
      }

      for (const quoteCurrency of quoteOrder) {
        const preferred = baseMatches.find((pair) =>
          (pair.altname || "").toUpperCase().endsWith(quoteCurrency) ||
          (pair.wsname || "").toUpperCase().endsWith(`/${quoteCurrency}`)
        );
        if (preferred) return preferred;
      }

      return baseMatches[0];
    }

    async function fetchKrakenTicker(query) {
      const symbol = query.trim();
      if (!symbol) return { error: "missing ticker" };

      try {
        await ensureKrakenPairs();
        const pair = resolveKrakenPair(symbol);
        if (!pair) return { error: `no Kraken pair found for ${symbol}` };

        const response = await fetch(`https://api.kraken.com/0/public/Ticker?pair=${encodeURIComponent(pair.key)}`, {
          headers: { accept: "application/json" }
        });
        if (!response.ok) return { error: `ticker HTTP ${response.status}` };

        const payload = await response.json();
        const result = payload?.result || {};
        const pairData = result[pair.key] || result[Object.keys(result)[0]];
        if (!pairData) return { error: `no Kraken ticker for ${symbol}` };

        return {
          product: {
            id: pair.key,
            display_name: pair.wsname || pair.altname || pair.key
          },
          price: pairData.c?.[0],
          time: new Date().toISOString()
        };
      } catch (error) {
        return { error: error instanceof Error ? error.message : "ticker lookup failed" };
      }
    }

    async function fetchTerminalQuote(query) {
      const coinbase = await fetchCoinbaseTicker(query);
      const kraken = await fetchKrakenTicker(query);
      if (!coinbase.error) return coinbase;
      if (!kraken.error) return kraken;
      return coinbase;
    }

    function terminalHistoryEntry(command, output) {
      state.terminal.history.push({ command, output });
      if (state.terminal.history.length > 8) state.terminal.history = state.terminal.history.slice(-8);
      renderTerminal();
    }

    function describeBuffers() {
      return state.open.map((file, index) => terminalLine(`${index + 1}. ${file}${file === state.active ? " (active)" : ""}`, file === state.active ? "green" : "term-meta"));
    }

    function describeTree() {
      return visibleTreeNodes().map((node) => {
        const label = node.kind === "folder" ? `${node.name}/` : node.path;
        return terminalLine(`- ${label}`, node.kind === "folder" ? "term-meta" : "");
      });
    }

    async function runTerminalCommand(raw) {
      const command = raw.trim();
      terminalCommand.value = "";
      state.terminal.draft = "";
      state.terminal.cursor = 0;
      if (!command) return;

      const normalized = command.toLowerCase();
      let output = [];

      if (normalized === "clear") {
        state.terminal.history = [];
        state.terminal.broken = false;
        document.body.classList.remove("page-broken");
        renderTerminal();
        return;
      } else if (/^price\s+/i.test(command)) {
        const query = command.replace(/^price\s+/i, "").trim();
        const quote = await fetchTerminalQuote(query);
        if (quote.error) {
          output = [
            terminalLine(quote.error, "red"),
            terminalLine("try: BTC, ETH, SOL, XMR, XRP, or price BTC", "term-meta")
          ];
        } else {
          const price = Number.parseFloat(quote.price);
          const timestamp = new Date(quote.time);
          const prettyTime = Number.isNaN(timestamp.getTime())
            ? quote.time
            : timestamp.toLocaleString(undefined, {
                month: "short",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
              });
          output = [
            terminalLine(`${quote.product.display_name || quote.product.id}`, "term-meta"),
            terminalLine(`last  $${Number.isFinite(price) ? price.toFixed(2) : quote.price}`, "green"),
            terminalLine(`time  ${prettyTime}`, "term-meta")
          ];
        }
      } else {
        output = [
          terminalLine(`command not found: ${command}`, "red"),
          terminalLine("try: price BTC", "term-meta")
        ];
      }

      terminalHistoryEntry(command, output);
    }

    function renderExplorer() {
      main.classList.toggle("explorer-hidden", !state.explorer);
      const nodes = visibleTreeNodes();
      const totalNodes = state.explorerFilter.trim()
        ? treeNodes.filter((node) => !node.parent || state.expanded.includes(node.parent))
        : nodes;
      state.explorerIndex = Math.max(0, Math.min(nodes.length - 1, state.explorerIndex));
      explorerFilter.value = state.explorerFilter;
      explorerCount.textContent = `${nodes.length}/${totalNodes.length}`;
      tree.innerHTML = nodes.map((node, index) => {
        const indent = `<span class="tree-indent ${node.depth ? "has-guide" : ""}" style="--depth:${node.depth}"></span>`;
        const isSelected = state.window === "explorer" && index === state.explorerIndex;
        if (node.kind === "folder") {
          const isExpanded = state.expanded.includes(node.path);
          return `
            <li>
              <button class="tree-item is-folder ${isSelected ? "is-selected" : ""}" data-folder="${node.path}" tabindex="-1">
                ${indent}
                <span class="file-icon icon-folder">${isExpanded ? "" : ""}</span>
                <span class="file-name">${node.name}</span>
                <span class="file-mark">${isExpanded ? "▾" : "▸"}</span>
              </button>
            </li>
          `;
        }

        const file = node.path;
        const isOpen = state.open.includes(file);
        const isActive = file === state.active;
        const isCurrent = isActive && state.window !== "explorer";
        const label = node.depth ? file.split("/").at(-1) : file;
        return `
          <li>
            <button class="tree-item ${isCurrent ? "is-active" : ""} ${isSelected ? "is-selected" : ""} ${isOpen ? "is-open" : ""}" data-file="${file}">
              ${indent}
              <span class="file-icon ${node.iconClass}">${fileRecord(file)?.icon || ""}</span>
              <span class="file-name">${label}</span>
              <span class="file-mark">${isOpen ? "●" : ""}</span>
            </button>
          </li>
        `;
      }).join("");

      const selected = tree.querySelector(".tree-item.is-selected");
      if (selected) {
        const head = explorer.querySelector(".explorer-head");
        const headHeight = head ? head.getBoundingClientRect().height : 0;
        const itemHeight = selected.getBoundingClientRect().height || 24;
        const topGuard = headHeight + itemHeight * 4;
        const bottomGuard = explorer.clientHeight - itemHeight * 4;
        const top = selected.offsetTop - explorer.scrollTop;
        const bottom = top + itemHeight;

        if (top < topGuard) {
          explorer.scrollTop = Math.max(0, selected.offsetTop - topGuard);
        } else if (bottom > bottomGuard) {
          explorer.scrollTop = Math.max(0, selected.offsetTop - bottomGuard + itemHeight);
        }
      }
    }

    function renderWindows() {
      if (!state.explorer && state.window === "explorer") state.window = "editor";
      explorer.classList.toggle("is-window-active", state.window === "explorer");
      editorPane.classList.toggle("is-window-active", state.window === "editor");
      terminalPane.classList.toggle("is-window-active", state.window === "terminal");
    }

    function renderTabs() {
      const showTabs = state.open.length > 1;
      tabline.classList.toggle("is-hidden", !showTabs);
      rightPane.classList.toggle("no-tabline", !showTabs);
      tabs.innerHTML = showTabs
        ? state.open.map((file) => `
            <button class="tab ${file === state.active ? "is-active" : ""}" data-file="${file}">
              <span class="${iconClassFor(file)}">${fileRecord(file)?.icon || ""}</span>
              <span>${state.pinned.includes(file) ? "󰐃" : ""}</span>
              <span>${file}</span>
              <span class="tab-close" data-close="${file}" aria-label="close ${file}">×</span>
            </button>
          `).join("")
        : "";
    }

    function renderBuffer() {
      const file = fileRecord(state.active);
      if (!state.active || !file) {
        winbar.innerHTML = `<span class="file-badge"><span></span><span>empty</span></span>`;
        buffer.innerHTML = `<div class="line"><span class="line-number">~</span><span class="line-text empty">No buffer. Press <span class="type">SPC e</span> and open a file.</span></div>`;
        filetype.textContent = "none";
        statusFileIcon.textContent = "";
        statusFileIcon.className = "";
        statusFileName.textContent = "empty";
        position.textContent = "0:0";
        leaderState.textContent = "0%";
        state.percent = 0;
        return;
      }

      const last = file.lines.length - 1;
      state.cursor = Math.max(0, Math.min(last, state.cursor));
      if (state.visual && state.visual.file !== state.active) state.visual = null;
      const iconClass = iconClassFor(state.active);
      winbar.innerHTML = `<span class="file-badge"><span class="${iconClass}">${file.icon}</span><span>${shortFileName(state.active)}</span></span>`;
      filetype.textContent = file.type;
      statusFileIcon.textContent = file.icon;
      statusFileIcon.className = iconClass;
      statusFileName.textContent = shortFileName(state.active);
      state.percent = Math.round(((state.cursor + 1) / file.lines.length) * 100);
      if (!state.leader) leaderState.textContent = `${state.percent}%`;
      position.textContent = `${state.cursor + 1}:1`;
      const visualStart = state.visual ? Math.min(state.visual.anchor, state.cursor) : -1;
      const visualEnd = state.visual ? Math.max(state.visual.anchor, state.cursor) : -1;
      buffer.innerHTML = file.lines.map((line, index) => `
        <div class="line ${index === state.cursor ? "is-cursor" : ""} ${state.visual && index >= visualStart && index <= visualEnd ? "is-visual" : ""}">
          <span class="line-number">${index + 1}</span>
          <span class="line-text">${renderFileLine(file, line)}</span>
        </div>
      `).join("");

      const activeLine = buffer.querySelector(".is-cursor");
      if (activeLine) activeLine.scrollIntoView({ block: "nearest" });
    }

    function renderWhichKey(group = "root") {
      const rows = groups[group] || groups.root;
      const prefix = state.leader ? `SPC ${state.leader}` : "SPC";
      wkTitle.textContent = prefix;
      const icons = {
        b: "󰓩",
        d: "󰆴",
        D: "󰆴",
        e: "󰙅",
        f: "󰈞",
        g: "󰊢",
        h: "󰁍",
        j: "󰁅",
        k: "󰁝",
        l: "󰁔",
        n: "󰒭",
        o: "󰝰",
        p: "󰐃",
        P: "󰗮",
        q: "󰅖",
        r: "󰁔",
        w: "",
        "`": "󰁯",
        "?": "󰋗"
      };
      const iconTones = {
        e: "is-green",
        b: "is-blue",
        f: "is-peach",
        w: "is-mauve",
        h: "is-yellow",
        j: "is-sky",
        k: "is-teal",
        l: "is-lavender",
        n: "is-pink",
        o: "is-red",
        q: "is-red",
        d: "is-flamingo",
        D: "is-maroon",
        g: "is-green",
        P: "is-yellow",
        r: "is-sky",
        "`": "is-overlay",
        "?": "is-mauve"
      };
      wkGrid.innerHTML = rows.map(([key, desc]) => `
        <div class="wk-row">
          <span class="wk-key">${key}</span>
          <span class="wk-arrow">→</span>
          <span class="wk-icon ${iconTones[key] || "is-blue"}">${icons[key] || "󰌌"}</span>
          <span class="wk-desc">${desc}</span>
        </div>
      `).join("") + `
        <div class="wk-footer">
          <span><kbd>ESC</kbd> close</span>
        </div>
      `;
      whichKey.hidden = false;
    }

    function hideWhichKey() {
      state.leader = "";
      leaderState.textContent = `${state.percent}%`;
      whichKey.hidden = true;
      updateModeIndicator();
    }

    function render() {
      renderExplorer();
      renderTabs();
      renderBuffer();
      renderWindows();
      renderTerminal();
      updateModeIndicator();
      recentKeys.textContent = state.recentKeys.filter(Boolean).join(" ");
      bufCount.textContent = state.open.length;
    }

    function activateBuffer(file) {
      if (!fileRecord(file)) return;
      if (state.active && state.active !== file) state.previous = state.active;
      state.active = file;
      state.cursor = 0;
    }

    function openFile(file) {
      if (!fileRecord(file)) return;
      const node = treeNodes.find((item) => item.path === file);
      const expandParents = (parentPath) => {
        if (!parentPath) return;
        const parent = treeNodes.find((item) => item.path === parentPath);
        if (parent?.parent) expandParents(parent.parent);
        if (!state.expanded.includes(parentPath)) state.expanded.push(parentPath);
      };
      if (node?.parent) expandParents(node.parent);
      if (!state.open.includes(file)) state.open.push(file);
      activateBuffer(file);
      state.window = "editor";
      message.textContent = `${file} opened`;
      hideWhichKey();
      render();
      buffer.focus({ preventScroll: true });
    }

    function focusWindow(target) {
      if (target === "explorer") {
        state.explorer = true;
        state.window = "explorer";
        const activeIndex = visibleTreeNodes().findIndex((node) => node.path === state.active);
        state.explorerIndex = activeIndex >= 0 ? activeIndex : state.explorerIndex;
        message.textContent = "focused explorer";
      } else if (target === "terminal") {
        state.window = "terminal";
        message.textContent = "focused terminal";
      } else {
        state.window = "editor";
        message.textContent = "focused editor";
      }
      hideWhichKey();
      render();
      const focusTarget = state.window === "terminal"
        ? terminalCommand
        : state.window === "explorer"
          ? explorer
          : buffer;
      focusTarget.focus({ preventScroll: true });
    }

    function moveExplorer(delta) {
      if (!state.explorer) return;
      const nodes = visibleTreeNodes();
      state.explorerIndex = Math.max(0, Math.min(nodes.length - 1, state.explorerIndex + delta));
      render();
    }

    function toggleFolder(folder) {
      if (state.expanded.includes(folder)) {
        state.expanded = state.expanded.filter((item) => item !== folder);
        message.textContent = `${folder}/ collapsed`;
      } else {
        state.expanded.push(folder);
        message.textContent = `${folder}/ expanded`;
      }
      render();
    }

    function openExplorerSelection() {
      const node = visibleTreeNodes()[state.explorerIndex];
      if (!node) {
        message.textContent = "no file";
        render();
        return;
      }
      if (node.kind === "folder") {
        toggleFolder(node.path);
        return;
      }
      openFile(node.path);
      state.window = "editor";
      render();
    }

    function closeBuffer(file = state.active) {
      const index = state.open.indexOf(file);
      if (index === -1) return;
      state.open.splice(index, 1);
      state.pinned = state.pinned.filter((item) => item !== file);

      if (state.active === file) {
        const next = state.open[index] || state.open[index - 1] || "";
        state.active = "";
        if (next) activateBuffer(next);
        state.cursor = 0;
      }

      message.textContent = `${file} deleted`;
      hideWhichKey();
      render();
      buffer.focus({ preventScroll: true });
    }

    function cycleBuffer(delta) {
      if (!state.open.length) return;
      const index = state.open.indexOf(state.active);
      const next = (index + delta + state.open.length) % state.open.length;
      activateBuffer(state.open[next]);
      message.textContent = state.active;
      hideWhichKey();
      render();
    }

    function selectBufferByNumber(digit) {
      if (!state.open.length) return false;
      const index = digit === 0 ? 9 : digit - 1;
      if (index < 0 || index >= state.open.length) return false;
      activateBuffer(state.open[index]);
      message.textContent = state.active;
      hideWhichKey();
      render();
      buffer.focus({ preventScroll: true });
      return true;
    }

    function switchAlternate() {
      if (state.previous && state.open.includes(state.previous)) {
        activateBuffer(state.previous);
        message.textContent = state.active;
      } else if (state.open.length > 1) {
        cycleBuffer(1);
        return;
      } else {
        message.textContent = "no alternate buffer";
      }
      hideWhichKey();
      render();
    }

    function closeOthers() {
      if (!state.active) return;
      state.open = [state.active];
      state.pinned = state.pinned.filter((file) => file === state.active);
      message.textContent = "deleted other buffers";
      hideWhichKey();
      render();
    }

    function closeNonPinned() {
      if (!state.active) return;
      const keep = state.open.filter((file) => state.pinned.includes(file) || file === state.active);
      state.open = keep.length ? keep : [state.active];
      message.textContent = "deleted non-pinned buffers";
      hideWhichKey();
      render();
    }

    function closeDirection(direction) {
      const index = state.open.indexOf(state.active);
      if (index === -1) return;
      state.open = direction === "right" ? state.open.slice(0, index + 1) : state.open.slice(index);
      state.pinned = state.pinned.filter((file) => state.open.includes(file));
      message.textContent = `deleted buffers to the ${direction}`;
      hideWhichKey();
      render();
    }

    function togglePin() {
      if (!state.active) return;
      if (state.pinned.includes(state.active)) {
        state.pinned = state.pinned.filter((file) => file !== state.active);
        message.textContent = "unpinned buffer";
      } else {
        state.pinned.push(state.active);
        message.textContent = "pinned buffer";
      }
      hideWhichKey();
      render();
    }

    function pickBuffer() {
      if (!state.open.length) return;
      cycleBuffer(1);
      message.textContent = "picked next buffer";
    }

    function moveCursor(delta) {
      if (!state.active) return;
      const record = fileRecord(state.active);
      if (!record) return;
      const last = record.lines.length - 1;
      state.cursor = Math.max(0, Math.min(last, state.cursor + delta));
      renderBuffer();
    }

    function enterVisualLineMode() {
      if (!state.active || state.window !== "editor") return;
      if (state.visual && state.visual.file === state.active) {
        state.visual = null;
        message.textContent = "visual mode off";
      } else {
        state.visual = { file: state.active, anchor: state.cursor };
        message.textContent = "visual line mode";
      }
      renderBuffer();
      updateModeIndicator();
    }

    async function yankVisualSelection() {
      const file = fileRecord(state.active);
      if (!state.visual || state.visual.file !== state.active || !file) return false;
      const start = Math.max(0, Math.min(state.visual.anchor, state.cursor));
      const end = Math.max(0, Math.max(state.visual.anchor, state.cursor));
      const text = file.lines.slice(start, end + 1).map((line) => plainLine(line)).join("\n");
      state.yank = text;
      state.visual = null;
      message.textContent = `yanked ${end - start + 1} lines`;
      showYankToast(end - start + 1);
      try {
        if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
      } catch {
        // clipboard fallback stays in state.yank
      }
      renderBuffer();
      updateModeIndicator();
      return true;
    }

    async function yankCurrentLine() {
      const file = fileRecord(state.active);
      if (!state.active || !file) return false;
      const line = file.lines[state.cursor];
      const text = plainLine(line);
      state.yank = text;
      message.textContent = "yanked 1 line";
      showYankToast(1);
      try {
        if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
      } catch {
        // clipboard fallback stays in state.yank
      }
      updateModeIndicator();
      return true;
    }

    function toggleExplorer() {
      state.explorer = !state.explorer;
      if (state.explorer) {
        state.window = "explorer";
        const nodes = visibleTreeNodes();
        const activeIndex = nodes.findIndex((node) => node.path === state.active);
        state.explorerIndex = activeIndex >= 0 ? activeIndex : 0;
      } else if (state.window === "explorer") {
        state.window = "editor";
      }
      message.textContent = state.explorer ? "neo-tree opened" : "neo-tree hidden";
      hideWhichKey();
      render();
      if (state.explorer) explorer.focus({ preventScroll: true });
      else explorerFilter.blur();
    }

    explorerFilter.addEventListener("input", () => {
      state.explorerFilter = explorerFilter.value;
      state.explorerIndex = 0;
      renderExplorer();
      updateModeIndicator();
    });

    terminalCommandForm.addEventListener("submit", (event) => {
      event.preventDefault();
      void runTerminalCommand(terminalCommand.value);
      terminalCommand.focus({ preventScroll: true });
    });

    terminalCommand.addEventListener("input", () => {
      state.terminal.draft = terminalCommand.value;
      state.terminal.cursor = terminalCommand.selectionStart ?? terminalCommand.value.length;
      renderTerminal();
      updateModeIndicator();
    });

    terminalCommand.addEventListener("focus", () => {
      state.terminal.cursor = terminalCommand.selectionStart ?? terminalCommand.value.length;
      renderTerminal();
      updateModeIndicator();
    });

    terminalCommand.addEventListener("blur", () => {
      renderTerminal();
      updateModeIndicator();
    });

    terminalCommand.addEventListener("keyup", () => {
      state.terminal.cursor = terminalCommand.selectionStart ?? terminalCommand.value.length;
      renderTerminal();
    });

    terminalCommand.addEventListener("click", () => {
      state.terminal.cursor = terminalCommand.selectionStart ?? terminalCommand.value.length;
      renderTerminal();
      updateModeIndicator();
    });

    terminalPane.addEventListener("click", () => {
      if (state.window === "terminal") terminalCommand.focus({ preventScroll: true });
    });

    function runCommand(raw) {
      const input = raw.trim().replace(/^:/, "");
      if (!input) {
        hideCommandLine();
        return;
      }
      if (input === "q" || input === "bd") {
        closeBuffer();
      } else if (input === "bo") {
        closeOthers();
      } else if (input === "bD") {
        closeBuffer();
      } else if (input === "br") {
        closeDirection("right");
      } else if (input === "bl") {
        closeDirection("left");
      } else if (input === "bP") {
        closeNonPinned();
      } else if (input === "bpin" || input === "bpin!") {
        togglePin();
      } else if (input === "bn") {
        cycleBuffer(1);
      } else if (input === "bp") {
        cycleBuffer(-1);
      } else if (input === "Neotree" || input === "NvimTreeToggle") {
        toggleExplorer();
      } else if (/^markdownPreview!?(\s+tab|\s+page)?$/i.test(input)) {
        const target = /!|\stab$/i.test(input) ? "tab" : "page";
        showMarkdownPreview(target);
      } else if (input.startsWith("e ")) {
        const query = input.slice(2).trim();
        const match = Object.keys(files).find((file) => file.includes(query));
        match ? openFile(match) : message.textContent = `file not found: ${query}`;
      } else {
        message.textContent = `not an editor command: ${input}`;
      }
      hideCommandLine();
    }

    function hideCommandMenu() {
      commandCompletionItems = [];
      commandCompletionIndex = 0;
      commandMenu.hidden = true;
      commandMenu.innerHTML = "";
    }

    function renderCommandMenu() {
      if (!commandCompletionItems.length) {
        hideCommandMenu();
        return;
      }

      commandMenu.innerHTML = commandCompletionItems.map((item, index) => `
        <li class="cmd-menu-item ${index === commandCompletionIndex ? "is-selected" : ""}" data-command="${escapeHtml(item.value)}">
          <span>${escapeHtml(item.value)}</span>
          <span class="cmd-menu-kind">${escapeHtml(item.kind)}</span>
        </li>
      `).join("");
      commandMenu.hidden = false;
    }

    function updateCommandSuggestion() {
      const value = command.value.trim();
      const markdown = activeMarkdownReadme();
      if (!markdown || !value) {
        hideCommandMenu();
        return;
      }

      const query = value.toLowerCase();
      commandCompletionItems = commandCompletions.filter((item) =>
        item.value.toLowerCase().startsWith(query)
      );
      commandCompletionIndex = Math.max(0, Math.min(commandCompletionIndex, commandCompletionItems.length - 1));
      renderCommandMenu();
    }

    function moveCommandCompletion(delta) {
      if (!commandCompletionItems.length) return false;
      commandCompletionIndex = (commandCompletionIndex + delta + commandCompletionItems.length) % commandCompletionItems.length;
      renderCommandMenu();
      return true;
    }

    function acceptCommandCompletion() {
      if (!commandCompletionItems.length) return false;
      const item = commandCompletionItems[commandCompletionIndex];
      command.value = item.value;
      command.setSelectionRange(command.value.length, command.value.length);
      hideCommandMenu();
      return true;
    }

    function handleLeaderKey(key) {
      if (key === "Shift" || key === "Control" || key === "Alt" || key === "Meta" || key === "CapsLock") {
        return true;
      }

      if (!state.leader) {
        if (key === " ") {
          state.leader = "root";
          leaderState.textContent = "leader: SPC";
          message.textContent = "which-key";
          renderWhichKey("root");
          updateModeIndicator();
          return true;
        }
        return false;
      }

      if (state.leader === "root") {
        if (key === "e") {
          toggleExplorer();
          return true;
        }
        if (key === "b" || key === "f" || key === "w") {
          state.leader = key;
          leaderState.textContent = `leader: SPC ${key}`;
          renderWhichKey(key);
          return true;
        }
        if (key === "h") {
          cycleBuffer(-1);
          return true;
        }
        if (key === "l") {
          cycleBuffer(1);
          return true;
        }
        if (key === "o") {
          closeOthers();
          return true;
        }
        if (key === "`") {
          switchAlternate();
          return true;
        }
        if (key === "q") {
          closeBuffer();
          return true;
        }
        if (key === "?") {
          openFile("docs/help.md");
          return true;
        }
      }

      if (state.leader === "b") {
        if (key === "b") switchAlternate();
        else if (key === "d") closeBuffer();
        else if (key === "D") closeBuffer();
        else if (key === "j") pickBuffer();
        else if (key === "l") closeDirection("left");
        else if (key === "r") closeDirection("right");
        else if (key === "o") closeOthers();
        else if (key === "p") togglePin();
        else if (key === "P") closeNonPinned();
        else if (key === "n") cycleBuffer(1);
        else message.textContent = `no mapping: SPC b ${key}`;
        hideWhichKey();
        return true;
      }

      if (state.leader === "f") {
        if (key === "g") window.open(links.github, "_blank", "noopener");
        else if (key === "l") window.open(links.linkedin, "_blank", "noopener");
        else if (key === "e") window.open(links.eips, "_blank", "noopener");
        else if (key === "h") openFile("docs/help.md");
        else message.textContent = `no mapping: SPC f ${key}`;
        hideWhichKey();
        return true;
      }

      if (state.leader === "w") {
        if (key === "h") focusWindow("explorer");
        else if (key === "j") focusWindow("terminal");
        else if (key === "k" || key === "l") focusWindow("editor");
        else {
          message.textContent = `no mapping: SPC w ${key}`;
          hideWhichKey();
        }
        return true;
      }

      hideWhichKey();
      return true;
    }

    tree.addEventListener("click", (event) => {
      const folder = event.target.closest("[data-folder]");
      if (folder) {
        const index = visibleTreeNodes().findIndex((node) => node.path === folder.dataset.folder);
        if (index >= 0) state.explorerIndex = index;
        toggleFolder(folder.dataset.folder);
        return;
      }

      const item = event.target.closest("[data-file]");
      if (item) {
        const index = visibleTreeNodes().findIndex((node) => node.path === item.dataset.file);
        if (index >= 0) state.explorerIndex = index;
        openFile(item.dataset.file);
      }
    });

    tabs.addEventListener("click", (event) => {
      const close = event.target.closest("[data-close]");
      if (close) {
        event.stopPropagation();
        closeBuffer(close.dataset.close);
        return;
      }

      const tab = event.target.closest("[data-file]");
      if (tab) openFile(tab.dataset.file);
    });

    commandForm.addEventListener("submit", (event) => {
      event.preventDefault();
      runCommand(command.value);
    });

    command.addEventListener("input", updateCommandSuggestion);

    command.addEventListener("focus", () => {
      hideWhichKey();
      updateCommandSuggestion();
      updateModeIndicator();
    });

    commandMenu.addEventListener("mousedown", (event) => {
      event.preventDefault();
      const item = event.target.closest("[data-command]");
      if (!item) return;
      command.value = item.dataset.command;
      command.setSelectionRange(command.value.length, command.value.length);
      hideCommandMenu();
      command.focus({ preventScroll: true });
    });

    markdownPreviewClose.addEventListener("click", () => {
      hideMarkdownPreview();
      buffer.focus({ preventScroll: true });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key.length === 1 || event.key.startsWith("Arrow") || event.key === "Enter" || event.key === "Escape") {
        const k = event.key === " " ? "SPC" : event.key === "Escape" ? "ESC" : event.key;
        state.recentKeys = [state.recentKeys[1], state.recentKeys[2], k];
        recentKeys.textContent = state.recentKeys.filter(Boolean).join(" ");
      }

      if (!markdownPreview.hidden && event.key === "Escape") {
        event.preventDefault();
        hideMarkdownPreview();
        buffer.focus({ preventScroll: true });
        return;
      }

      if (document.activeElement === command) {
        if (event.key === "ArrowDown" || (event.ctrlKey && event.key.toLowerCase() === "n")) {
          if (moveCommandCompletion(1)) {
            event.preventDefault();
          }
          return;
        }

        if (event.key === "ArrowUp" || (event.ctrlKey && event.key.toLowerCase() === "p")) {
          if (moveCommandCompletion(-1)) {
            event.preventDefault();
          }
          return;
        }

        if (event.key === "Tab") {
          if (acceptCommandCompletion()) event.preventDefault();
          return;
        }

        if (event.key === "Enter" && commandCompletionItems.length) {
          event.preventDefault();
          acceptCommandCompletion();
          return;
        }

        if (event.key === "Escape") {
          event.preventDefault();
          hideCommandLine();
          message.textContent = "normal mode";
          buffer.focus({ preventScroll: true });
          updateModeIndicator();
        }
        return;
      }

      if (document.activeElement === explorerFilter) {
        if (event.key === "Escape") {
          event.preventDefault();
          state.explorerFilter = "";
          explorerFilter.value = "";
          renderExplorer();
          buffer.focus({ preventScroll: true });
          updateModeIndicator();
        }
        return;
      }

      if (document.activeElement === terminalCommand) {
        if (event.key === "Escape") {
          event.preventDefault();
          terminalCommand.blur();
          buffer.focus({ preventScroll: true });
          updateModeIndicator();
        }
        return;
      }

      if (event.key === "Escape") {
        event.preventDefault();
        hideWhichKey();
        return;
      }

      if (!state.leader && !event.ctrlKey && !event.metaKey && !event.altKey && /^[0-9]$/.test(event.key)) {
        if (selectBufferByNumber(Number(event.key))) {
          event.preventDefault();
          return;
        }
      }

      if (handleLeaderKey(event.key)) {
        event.preventDefault();
        return;
      }

      if (event.key === ":") {
        event.preventDefault();
        showCommandLine();
        return;
      }

      if (state.window === "editor") {
        if (event.key === "V") {
          event.preventDefault();
          enterVisualLineMode();
          return;
        }

        if (event.key === "y" && state.visual) {
          event.preventDefault();
          void yankVisualSelection();
          return;
        }

        if (event.key === "y" && state.pendingY) {
          event.preventDefault();
          state.pendingY = false;
          void yankCurrentLine();
          return;
        }

        if (event.key === "y") {
          event.preventDefault();
          state.pendingY = true;
          message.textContent = "y";
          return;
        }
      }

      if (event.key === "i") {
        if (state.window === "terminal" && document.activeElement !== terminalCommand) {
          event.preventDefault();
          terminalCommand.focus({ preventScroll: true });
          updateModeIndicator();
          return;
        }

        if (state.window === "explorer" && document.activeElement !== explorerFilter) {
          event.preventDefault();
          explorerFilter.focus({ preventScroll: true });
          updateModeIndicator();
          return;
        }
      }

      if (state.window === "explorer") {
        if (event.key === "j" || event.key === "ArrowDown") {
          event.preventDefault();
          moveExplorer(1);
          return;
        }

        if (event.key === "k" || event.key === "ArrowUp") {
          event.preventDefault();
          moveExplorer(-1);
          return;
        }

        if (event.key === "Enter" || event.key === "l" || event.key === "ArrowRight") {
          event.preventDefault();
          const node = visibleTreeNodes()[state.explorerIndex];
          if (node?.kind === "folder") {
            if (!state.expanded.includes(node.path)) {
              toggleFolder(node.path);
            } else {
              openExplorerSelection();
            }
          } else {
            openExplorerSelection();
          }
          return;
        }

        if (event.key === "h" || event.key === "ArrowLeft") {
          event.preventDefault();
          const node = visibleTreeNodes()[state.explorerIndex];
          if (node?.kind === "folder" && state.expanded.includes(node.path)) {
            toggleFolder(node.path);
          } else if (node?.parent) {
            const parentIndex = visibleTreeNodes().findIndex((item) => item.path === node.parent);
            if (parentIndex >= 0) state.explorerIndex = parentIndex;
            renderExplorer();
          } else {
            message.textContent = "folder closed";
          }
          return;
        }
      }

      if (event.key === "j" || event.key === "ArrowDown") {
        event.preventDefault();
        state.pendingG = false;
        state.pendingY = false;
        moveCursor(1);
        return;
      }

      if (event.key === "k" || event.key === "ArrowUp") {
        event.preventDefault();
        state.pendingG = false;
        state.pendingY = false;
        moveCursor(-1);
        return;
      }

      if (event.key === "h" || event.key === "ArrowLeft") {
        event.preventDefault();
        state.pendingY = false;
        cycleBuffer(-1);
        return;
      }

      if (event.key === "l" || event.key === "ArrowRight") {
        event.preventDefault();
        state.pendingY = false;
        cycleBuffer(1);
        return;
      }

      if (event.key === "G") {
        event.preventDefault();
        const record = fileRecord(state.active);
        if (state.active && record) state.cursor = record.lines.length - 1;
        state.pendingG = false;
        state.pendingY = false;
        renderBuffer();
        return;
      }

      if (event.key === "g") {
        event.preventDefault();
        if (state.pendingG) {
          state.cursor = 0;
          state.pendingG = false;
          state.pendingY = false;
          renderBuffer();
        } else {
          state.pendingG = true;
          message.textContent = "g";
        }
      }
    });

    render();
    renderTerminal();
    buffer.focus({ preventScroll: true });
  </script>
</body>
</html>
